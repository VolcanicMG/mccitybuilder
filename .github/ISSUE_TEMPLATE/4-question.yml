name: Question
description: Not sure how something works, or whether it's a bug.
title: "[Question] "
labels: ["question", "needs triage"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Camera
        - Placing huts & decorations
        - Roads & walls
        - Plan mode
        - Builder queue
        - Managing buildings
        - Citizens & overlays
        - Multiplayer
        - UI & controls
        - Compatibility
        - Performance
        - Not sure
  - type: input
    id: version
    attributes:
      label: City Builder version
      placeholder: "0.1.0"
