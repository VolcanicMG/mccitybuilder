modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/VolcanicMG/mccitybuilder/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="VolcanicMG"
displayURL="https://github.com/VolcanicMG/mccitybuilder"
description='''
Plan and build your MineColonies town from the sky: an overhead city-builder view to place huts and decorations, draw walls and roads with your style pack's pieces, and run your builders through MineColonies' own build and work-order system. Beta.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecolonies"
    type="required"
    versionRange="[1.1.1403,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="structurize"
    type="required"
    versionRange="[1.0.832,)"
    ordering="AFTER"
    side="BOTH"
